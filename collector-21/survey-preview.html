<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collector 21 — Survey integration rehearsal</title><style>body{margin:0;background:#111918;color:#eee;font:14px sans-serif}header{padding:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}button{padding:9px}iframe{width:100%;height:85vh;border:0}#log{font-size:12px;color:#bed3a8}</style><header><b>Survey integration rehearsal</b><button id="next">Next variant</button><button id="mute">Mute</button><span id="log">Waiting for game handshake</span></header><iframe title="Study game" src="study/index.html"></iframe><script>
const frame=document.querySelector('iframe'),channel='superbet.study.v1',origin=location.origin,seen=new Set();let round=0,count=0;const plan=[{roundIndex:0,variantId:'preview-c21',variantLabel:'Collector 21',variantSlotIndex:1},{roundIndex:1,variantId:'preview-suits',variantLabel:'Suit Society',variantSlotIndex:2}];
function send(type,payload){frame.contentWindow.postMessage({channel,messageType:type,sessionId:'preview-session',payload},origin)}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==origin||e.data?.channel!==channel)return;const m=e.data;if(m.messageType==='host_handshake_request')send('host_handshake_ack',{attemptId:'preview-attempt',studyId:'preview-study',sessionId:'preview-session',participantToken:'preview-only',variantSlotIndex:plan[round].variantSlotIndex,currentRoundIndex:round,variantPlan:plan});if(m.messageType==='study_framing'&&m.payload.framingState==='intro')send('host_control',{action:'start_game'});if(m.messageType==='study_event'){const p=m.payload;send('study_event_ack',{eventId:p.eventId});if(seen.has(p.eventId))return;seen.add(p.eventId);if(p.eventName==='round_completed')count++;document.getElementById('log').textContent=`${plan[round].variantLabel}: ${count} resolved bets · latest ${p.eventName}`;}});
document.getElementById('next').onclick=()=>{if(round===1)return;round++;count=0;send('host_control',{action:'advance_round',nextRoundIndex:round,variantSlotIndex:plan[round].variantSlotIndex});send('host_control',{action:'start_game'})};document.getElementById('mute').onclick=()=>send('host_control',{action:'set_muted',muted:true});
</script></html>
