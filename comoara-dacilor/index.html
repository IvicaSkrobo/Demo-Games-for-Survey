<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Slot game</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /* Y-scroll ONLY when content genuinely overflows (e.g. browser zoom) — at normal fit the
           board is sized to the viewport, nothing overflows, and no scrollbar appears. */
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        margin: 0;
        /* 100vh is the LARGE viewport (browser chrome collapsed) — on a real phone the address bar
           is still showing at load, so the actually-visible viewport is smaller. 100dvh tracks the
           real visible height; 100vh stays first as a fallback for browsers without dvh support. */
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(75% 75% at 50% 35%, #1b0b3a 0%, #05010f 100%);
        font-family: system-ui, sans-serif;
        color: #eaffff;
      }
      #app {
        touch-action: manipulation;
        max-height: 100vh;
        max-height: 100dvh;
        margin: auto;
      }
      /* The board + HUD markup/styles come from @slot/devkit's createGameApp — no app-level
         heading needed. */
    </style>
    <script type="module" crossorigin src="./assets/index-CKKEFdB1.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
