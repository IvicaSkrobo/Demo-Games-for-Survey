<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamio Demo Games</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { font-size: 1.4rem; margin-bottom: 2rem; opacity: 0.6; letter-spacing: 0.1em; text-transform: uppercase; }
    .games { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    a.card { display: block; background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 2rem 2.5rem; text-decoration: none; color: #fff; text-align: center; transition: border-color 0.2s, transform 0.2s; }
    a.card:hover { border-color: #888; transform: translateY(-2px); }
    a.card .title { font-size: 1.1rem; font-weight: 600; }
    a.card .sub { font-size: 0.8rem; opacity: 0.45; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>Demo Games</h1>
  <div class="games">
    <a class="card" href="superbet-penalty/FreeMode/">
      <div class="title">Superbet Penalty</div>
      <div class="sub">Free mode</div>
    </a>
    <a class="card" href="circle/">
      <div class="title">Circle</div>
      <div class="sub">Circle game</div>
    </a>
  </div>
</body>
</html>
