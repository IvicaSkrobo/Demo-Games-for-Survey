<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamio Demo Games</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; }
    main { max-width: 1100px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 2.5rem; opacity: 0.6; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
    h2 { font-size: 0.8rem; margin: 2.2rem 0 1rem; color: #9a9a9a; letter-spacing: 0.12em; text-transform: uppercase; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    a.card { display: block; background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 1.4rem 1.5rem; text-decoration: none; color: #fff; transition: border-color 0.2s, transform 0.2s; }
    a.card:hover, a.card:focus-visible { border-color: #888; transform: translateY(-2px); outline: none; }
    a.card .title { font-size: 1.05rem; font-weight: 600; }
    a.card .sub { font-size: 0.8rem; color: #a8a8a8; margin-top: 0.4rem; line-height: 1.35; }
    a.card .owner { font-size: 0.7rem; color: #8a8a8a; margin-top: 0.8rem; }
    .error { color: #f99; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Demo Games</h1>
    <div id="catalog"></div>
    <noscript><p class="error">Turn on JavaScript to see the games list. Each game lives in its own folder, e.g. <a href="wheel/">wheel/</a>.</p></noscript>
  </main>
  <script>
    // The list of games comes from games.json: sections in order, games grouped by section.
    // "hidden": true keeps a game reachable by its link but off this page.
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    fetch("games.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then(({ sections = [], games = [], sectionRules = [] }) => {
        // Apply grouping after publishing metadata, so game updates preserve the team section.
        const shown = games.filter((g) => !g.hidden).map((g) => {
          const rule = sectionRules.find((r) =>
            !(r.excludePaths || []).includes(g.path) &&
            ((r.paths || []).includes(g.path) || (r.owners || []).some((owner) => g.owner === owner || (g.owner || "").startsWith(owner + " ")))
          );
          return rule ? { ...g, section: rule.section } : g;
        });
        const order = [...sections, ...new Set(shown.map((g) => g.section || "Other").filter((s) => !sections.includes(s)))];
        document.getElementById("catalog").innerHTML = order
          .map((section) => {
            const list = shown.filter((g) => (g.section || "Other") === section);
            if (!list.length) return "";
            return `<h2>${esc(section)}</h2><div class="games">${list
              .map((g) => `<a class="card" href="${esc(g.path)}"><div class="title">${esc(g.title)}</div><div class="sub">${esc(g.sub)}</div>${g.owner ? `<div class="owner">${esc(g.owner)}</div>` : ""}</a>`)
              .join("")}</div>`;
          })
          .join("");
      })
      .catch(() => {
        document.getElementById("catalog").innerHTML = '<p class="error">Could not load games.json.</p>';
      });
  </script>
</body>
</html>
