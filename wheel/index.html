<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wheel Prototype</title>
    <script type="module" crossorigin src="./assets/index-Bp0Wa5Lr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DNZy4vyt.css">
  </head>
  <body>
    <div id="app">
      <header>
        <div class="balance">Balance <b id="balance"></b></div>
        <div class="wheel-total">Riding <b id="wheel-total"></b></div>
        <div class="players"><span class="dot"></span><span id="players"></span> playing</div>
      </header>

      <main class="layout">
        <section class="play">
          <div class="stage">
            <canvas id="wheel"></canvas>
            <div id="toast" class="toast"></div>
          </div>
          <div class="status">Bet on a colour or a number. The arrow fires at random on a field: death kills every bet there; a cash-out pays colour bets, and number bets get x2 on a number hit or keep riding.</div>
          <div id="history" class="history"></div>
        </section>

        <aside class="panel">
          <div id="spots" class="spots"></div>
          <div class="numbers-title">Numbers · x2 on a number hit · only death kills</div>
          <div id="numbers" class="numbers"></div>
          <div class="controls">
            <div id="chips" class="chips"></div>
            <div class="actions">
              <button id="auto">Auto re-bet</button>
            </div>
          </div>
          <div class="mybets-title">Your bets riding</div>
          <div id="mybets" class="mybets"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
